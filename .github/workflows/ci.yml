name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Throwaway password for the CI-only SQL Server container. Not a real secret.
  SQL_PASSWORD: Ci_Only_Passw0rd!
  API_BASE_URL: http://localhost:5180
  WEB_BASE_URL: http://localhost:5190

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci_Only_Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci_Only_Passw0rd!' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test --project tests/ExpenseTracker.UnitTests --no-build --configuration Release

      - name: Integration tests
        env:
          ConnectionStrings__Default: Server=localhost,1433;Database=ExpenseTracker_IntegrationTests;User Id=sa;Password=${{ env.SQL_PASSWORD }};TrustServerCertificate=True
        run: dotnet test --project tests/ExpenseTracker.IntegrationTests --no-build --configuration Release

      - name: Start API and web app
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Default: Server=localhost,1433;Database=ExpenseTracker;User Id=sa;Password=${{ env.SQL_PASSWORD }};TrustServerCertificate=True
        run: |
          mkdir -p logs
          nohup dotnet run --project src/ExpenseTracker.Api --no-build --configuration Release --launch-profile http > logs/api.log 2>&1 &
          nohup dotnet run --project src/ExpenseTracker.Web --no-build --configuration Release --no-launch-profile --urls "$WEB_BASE_URL" > logs/web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf "$API_BASE_URL/health" | grep -q Healthy && curl -sf "$WEB_BASE_URL" > /dev/null; then
              echo "API and web app are up."
              exit 0
            fi
            sleep 2
          done
          echo "Apps did not start in time."
          cat logs/api.log logs/web.log
          exit 1

      - name: Install Playwright browsers
        run: pwsh tests/ExpenseTracker.UiTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: API tests
        run: dotnet test --project tests/ExpenseTracker.ApiTests --no-build --configuration Release

      - name: UI tests
        run: dotnet test --project tests/ExpenseTracker.UiTests --no-build --configuration Release

      - name: Upload logs and test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-test-results
          path: |
            logs/
            tests/**/TestResults/
          retention-days: 7
